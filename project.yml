name: DigitalDiscipline
options:
  bundleIdPrefix: com.digitaldiscipline
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: "YES"
    AD_HOC_CODE_SIGNING_ALLOWED: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

targets:
  DigitalDiscipline:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - App
      - Core
      - Features
    info:
      path: App/Info.plist
    entitlements:
      path: App/DigitalDiscipline.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.digitaldiscipline.DigitalDiscipline
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: "YES"
    dependencies:
      - target: DeviceActivityMonitorExtension
      - target: ShieldConfigurationExtension
      - target: ShieldActionExtension

  DeviceActivityMonitorExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Extensions/DeviceActivityMonitorExtension
    info:
      path: Extensions/DeviceActivityMonitorExtension/Info.plist
    entitlements:
      path: Extensions/DeviceActivityMonitorExtension/DeviceActivityMonitorExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.digitaldiscipline.DigitalDiscipline.DeviceActivityMonitorExtension
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: "YES"

  ShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Extensions/ShieldConfigurationExtension
    info:
      path: Extensions/ShieldConfigurationExtension/Info.plist
    entitlements:
      path: Extensions/ShieldConfigurationExtension/ShieldConfigurationExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.digitaldiscipline.DigitalDiscipline.ShieldConfigurationExtension
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: "YES"

  ShieldActionExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Extensions/ShieldActionExtension
    info:
      path: Extensions/ShieldActionExtension/Info.plist
    entitlements:
      path: Extensions/ShieldActionExtension/ShieldActionExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.digitaldiscipline.DigitalDiscipline.ShieldActionExtension
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: "YES"
