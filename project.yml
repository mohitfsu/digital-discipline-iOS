name: DigitalDiscipline
options:
  bundleIdPrefix: com.digitaldiscipline
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

targets:
  DigitalDiscipline:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - App
      - Core
      - Features
    info:
      path: App/Info.plist
    entitlements:
      path: App/DigitalDiscipline.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.digitaldiscipline.DigitalDiscipline
        SKIP_INSTALL: "NO"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        UILaunchStoryboardName: LaunchScreen
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: DeviceActivityMonitorExtension
      - target: ShieldConfigurationExtension
      - target: ShieldActionExtension
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: CoreLocation.framework
      - sdk: CoreMotion.framework
      - sdk: AVFoundation.framework
      - sdk: Vision.framework

  DeviceActivityMonitorExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Extensions/DeviceActivityMonitorExtension
    info:
      path: Extensions/DeviceActivityMonitorExtension/Info.plist
    entitlements:
      path: Extensions/DeviceActivityMonitorExtension/DeviceActivityMonitorExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.digitaldiscipline.DigitalDiscipline.DeviceActivityMonitorExtension
        SKIP_INSTALL: "YES"
        INFOPLIST_FILE: Extensions/DeviceActivityMonitorExtension/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework

  ShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Extensions/ShieldConfigurationExtension
    info:
      path: Extensions/ShieldConfigurationExtension/Info.plist
    entitlements:
      path: Extensions/ShieldConfigurationExtension/ShieldConfigurationExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.digitaldiscipline.DigitalDiscipline.ShieldConfigurationExtension
        SKIP_INSTALL: "YES"
        INFOPLIST_FILE: Extensions/ShieldConfigurationExtension/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework

  ShieldActionExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Extensions/ShieldActionExtension
    info:
      path: Extensions/ShieldActionExtension/Info.plist
    entitlements:
      path: Extensions/ShieldActionExtension/ShieldActionExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.digitaldiscipline.DigitalDiscipline.ShieldActionExtension
        SKIP_INSTALL: "YES"
        INFOPLIST_FILE: Extensions/ShieldActionExtension/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - sdk: ManagedSettings.framework
