name: Build Digital Discipline iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS App
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive Main App & Extensions
        run: |
          set -o pipefail
          xcodebuild archive \
            -project DigitalDiscipline.xcodeproj \
            -scheme DigitalDiscipline \
            -destination 'generic/platform=iOS' \
            -archivePath build_output/DigitalDiscipline.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Package App and Extensions into Standard IPA
        run: |
          echo "=== Inspecting Archive Contents ==="
          ls -la build_output/DigitalDiscipline.xcarchive/Products/Applications/
          
          # Copy real app from xcarchive into Payload
          mkdir -p output/Payload
          cp -R build_output/DigitalDiscipline.xcarchive/Products/Applications/DigitalDiscipline.app output/Payload/
          
          # Inspect contents of the app bundle and binary size
          echo "=== App Bundle Contents ==="
          ls -la output/Payload/DigitalDiscipline.app
          
          echo "=== App Binary Size ==="
          ls -lh output/Payload/DigitalDiscipline.app/DigitalDiscipline || true
          
          # Create final IPA
          cd output
          zip -r -9 DigitalDiscipline.ipa Payload
          cd ..
          
          echo "=== Final IPA File Info ==="
          ls -lh output/DigitalDiscipline.ipa

      - name: Upload Ready-to-Install IPA to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDiscipline-IPA
          path: output/DigitalDiscipline.ipa
          retention-days: 14
