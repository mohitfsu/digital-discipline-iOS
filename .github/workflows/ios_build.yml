name: Build Digital Discipline iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS App
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Main App & Extensions
        run: |
          xcodebuild build \
            -project DigitalDiscipline.xcodeproj \
            -scheme DigitalDiscipline \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build_log.txt || (echo "=== COMPILATION ERRORS ===" && grep -E "error:" build_log.txt && exit 1)

      - name: Package App and Extensions into Standard IPA
        run: |
          # Find the actual compiled DigitalDiscipline.app directory
          APP_PATH=$(find build_derived -name "DigitalDiscipline.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          
          # Ensure PlugIns directory exists inside app bundle
          mkdir -p "$APP_PATH/PlugIns"
          
          # Copy all compiled .appex extensions into PlugIns
          find build_derived -name "*.appex" -type d | while read -r appex; do
            echo "Embedding extension: $appex"
            cp -R "$appex" "$APP_PATH/PlugIns/"
          done
          
          # Construct standard iOS Payload structure
          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/
          
          # Create final IPA
          cd output
          zip -r -9 DigitalDiscipline.ipa Payload
          cd ..
          
          # Verify IPA size and contents
          ls -lh output/DigitalDiscipline.ipa

      - name: Upload Ready-to-Install IPA to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDiscipline-IPA
          path: output/DigitalDiscipline.ipa
          retention-days: 14
