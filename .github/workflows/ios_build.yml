name: Build Digital Discipline iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS App
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Main App & Extensions
        run: |
          xcodebuild \
            -project DigitalDiscipline.xcodeproj \
            -scheme DigitalDiscipline \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=build \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package App Bundle into Zip
        run: |
          mkdir -p output
          cd build/Release-iphoneos
          zip -r ../../output/DigitalDiscipline-Release.zip DigitalDiscipline.app
          cd ../..

      - name: Upload Build Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDiscipline-iOS-Build
          path: output/DigitalDiscipline-Release.zip
          retention-days: 14
