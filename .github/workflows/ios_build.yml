name: Build Digital Discipline iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS App
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Main App & Extensions
        run: |
          xcodebuild build \
            -project DigitalDiscipline.xcodeproj \
            -scheme DigitalDiscipline \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build_derived \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build_log.txt || (echo "=== COMPILATION ERRORS ===" && grep -E "error:" build_log.txt && exit 1)

      - name: Package App and Extensions into Standard IPA
        run: |
          echo "=== Searching for compiled DigitalDiscipline.app ==="
          APP_DIR=$(find build_derived -name "DigitalDiscipline.app" -type d | head -n 1)
          echo "Found app bundle at: $APP_DIR"
          
          # List all files inside the app bundle
          echo "=== Contents of $APP_DIR ==="
          ls -la "$APP_DIR"
          
          # Copy to Payload
          mkdir -p output/Payload
          cp -R "$APP_DIR" output/Payload/
          
          # Embed all compiled appex extensions into PlugIns
          mkdir -p output/Payload/DigitalDiscipline.app/PlugIns
          find build_derived -name "*.appex" -type d | while read -r appex; do
            echo "Embedding: $appex"
            cp -R "$appex" output/Payload/DigitalDiscipline.app/PlugIns/
          done
          
          cd output
          zip -r -9 DigitalDiscipline.ipa Payload
          cd ..
          
          echo "=== Final IPA File Info ==="
          ls -lh output/DigitalDiscipline.ipa

      - name: Upload Ready-to-Install IPA to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDiscipline-IPA
          path: output/DigitalDiscipline.ipa
          retention-days: 14
