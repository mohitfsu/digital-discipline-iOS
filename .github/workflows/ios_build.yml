name: Build Digital Discipline iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS App
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Main App & Extensions for Physical Device
        run: |
          xcodebuild build \
            -project DigitalDiscipline.xcodeproj \
            -scheme DigitalDiscipline \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=build \
            2>&1 | tee raw_build.log
          
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=========================================="
            echo "COMPILER ERROR REPORT:"
            echo "=========================================="
            grep -B 2 -A 4 -E "error:" raw_build.log || cat raw_build.log
            exit 1
          fi

      - name: Package Sideloadly-Compatible IPA and Full Extensions IPA
        run: |
          echo "=== Inspecting Build Output ==="
          ls -la build/Debug-iphoneos/
          
          # 1. Package Sideloadly IPA (optimized for Free Apple IDs)
          mkdir -p output_sideloadly/Payload
          cp -R build/Debug-iphoneos/DigitalDiscipline.app output_sideloadly/Payload/
          # Remove PlugIns from Sideloadly package to prevent free Apple ID IXPlaceholder error
          rm -rf output_sideloadly/Payload/DigitalDiscipline.app/PlugIns
          
          cd output_sideloadly
          zip -r -9 ../DigitalDiscipline.ipa Payload
          cd ..
          
          # 2. Package Full IPA with embedded PlugIns extensions
          mkdir -p output_full/Payload
          cp -R build/Debug-iphoneos/DigitalDiscipline.app output_full/Payload/
          mkdir -p output_full/Payload/DigitalDiscipline.app/PlugIns
          for appex in build/Debug-iphoneos/*.appex; do
            if [ -d "$appex" ]; then
              cp -R "$appex" output_full/Payload/DigitalDiscipline.app/PlugIns/
            fi
          done
          
          cd output_full
          zip -r -9 ../DigitalDiscipline-WithExtensions.ipa Payload
          cd ..
          
          echo "=== Final Sideloadly IPA File Info ==="
          ls -lh DigitalDiscipline.ipa
          
          mkdir -p output
          mv DigitalDiscipline.ipa output/
          mv DigitalDiscipline-WithExtensions.ipa output/

      - name: Upload Sideloadly Compatible IPA
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDiscipline-Sideloadly-IPA
          path: output/DigitalDiscipline.ipa
          retention-days: 14

      - name: Upload Full IPA with Extensions
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDiscipline-Full-IPA
          path: output/DigitalDiscipline-WithExtensions.ipa
          retention-days: 14
