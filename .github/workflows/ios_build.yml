name: Build Digital Discipline iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS App
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Main App & Extensions
        run: |
          xcodebuild build \
            -project DigitalDiscipline.xcodeproj \
            -scheme DigitalDiscipline \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build_log.txt || (echo "=== COMPILATION ERRORS ===" && grep -E "error:" build_log.txt && exit 1)

      - name: Package App and Extensions into Standard IPA
        run: |
          echo "=== Build Products Directory ==="
          ls -la build_derived/Build/Products/Debug-iphoneos/
          
          mkdir -p output/Payload
          cp -R build_derived/Build/Products/Debug-iphoneos/DigitalDiscipline.app output/Payload/
          
          # Embed all extensions into PlugIns
          mkdir -p output/Payload/DigitalDiscipline.app/PlugIns
          for appex in build_derived/Build/Products/Debug-iphoneos/*.appex; do
            if [ -d "$appex" ]; then
              echo "Embedding extension: $appex"
              cp -R "$appex" output/Payload/DigitalDiscipline.app/PlugIns/
            fi
          done
          
          echo "=== Final App Size ==="
          du -sh output/Payload/DigitalDiscipline.app
          
          cd output
          zip -r -9 DigitalDiscipline.ipa Payload
          cd ..
          
          echo "=== Final IPA File Size ==="
          ls -lh output/DigitalDiscipline.ipa

      - name: Upload Ready-to-Install IPA to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDiscipline-IPA
          path: output/DigitalDiscipline.ipa
          retention-days: 14
