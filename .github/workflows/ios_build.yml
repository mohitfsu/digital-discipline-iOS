name: Build Digital Discipline iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS App
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Main App & Extensions
        run: |
          xcodebuild build \
            -project DigitalDiscipline.xcodeproj \
            -scheme DigitalDiscipline \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=build \
            2>&1 | tee build_log.txt || (echo "=== COMPILATION ERRORS ===" && grep -E "error:" build_log.txt && exit 1)

      - name: Package App and Extensions into Standard IPA
        run: |
          # Ensure PlugIns directory exists and copy all app extensions into it
          mkdir -p build/Debug-iphoneos/DigitalDiscipline.app/PlugIns
          if ls build/Debug-iphoneos/*.appex 1> /dev/null 2>&1; then
            cp -r build/Debug-iphoneos/*.appex build/Debug-iphoneos/DigitalDiscipline.app/PlugIns/
          fi
          
          # Package into standard iOS Payload structure for Sideloadly
          mkdir -p output/Payload
          cp -r build/Debug-iphoneos/DigitalDiscipline.app output/Payload/
          cd output
          zip -r DigitalDiscipline.ipa Payload
          cd ..

      - name: Upload Ready-to-Install IPA to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDiscipline-IPA
          path: output/DigitalDiscipline.ipa
          retention-days: 14
