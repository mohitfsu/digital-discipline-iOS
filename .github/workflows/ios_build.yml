name: Build Digital Discipline iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS App
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Main App & Extensions for Physical Device
        run: |
          xcodebuild build \
            -project DigitalDiscipline.xcodeproj \
            -scheme DigitalDiscipline \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=build \
            2>&1 | tee raw_build.log
          
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=========================================="
            echo "COMPILER ERROR REPORT:"
            echo "=========================================="
            grep -B 2 -A 4 -E "error:" raw_build.log || cat raw_build.log
            exit 1
          fi

      - name: Package App and Extensions into Standard IPA
        run: |
          echo "=== Inspecting Build Output ==="
          ls -la build/Debug-iphoneos/
          
          # Ensure PlugIns directory exists inside the app
          mkdir -p build/Debug-iphoneos/DigitalDiscipline.app/PlugIns
          
          # Copy all extension .appex bundles into DigitalDiscipline.app/PlugIns/
          for appex in build/Debug-iphoneos/*.appex; do
            if [ -d "$appex" ]; then
              echo "Embedding extension: $appex"
              cp -R "$appex" build/Debug-iphoneos/DigitalDiscipline.app/PlugIns/
            fi
          done
          
          # Verify the Mach-O binary exists and check its size
          echo "=== Executable Binary Info ==="
          ls -lh build/Debug-iphoneos/DigitalDiscipline.app/DigitalDiscipline || true
          
          # Copy full app to Payload for IPA
          mkdir -p output/Payload
          cp -R build/Debug-iphoneos/DigitalDiscipline.app output/Payload/
          
          # Package into standard IPA
          cd output
          zip -r -9 DigitalDiscipline.ipa Payload
          cd ..
          
          echo "=== Final IPA Size ==="
          ls -lh output/DigitalDiscipline.ipa

      - name: Upload Ready-to-Install IPA to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDiscipline-IPA
          path: output/DigitalDiscipline.ipa
          retention-days: 14
